# Generated by `deno task security:sync` from the folders that exist; re-run it after adding or removing an app.
# Updates arrive as grouped weekly pull requests, and CI must pass before you merge them. Using GitLab or wanting
# one tool for everything? See docs/DEVSECOPS.md for a Renovate alternative.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it: most malicious or broken releases are pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      github_actions_minor_patch:
        update-types: [minor, patch]
  - package-ecosystem: deno
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it: most malicious or broken releases are pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      deno_minor_patch:
        update-types: [minor, patch]
