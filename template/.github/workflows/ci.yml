# Runs on every pull request and on main. Read docs/DEVSECOPS.md for what each job protects against.
# Every third-party action is pinned to a commit SHA (the comment names the version); Dependabot keeps the pins fresh.
# The job named "required" is the one to mark as required in branch protection: it is green only when all others are.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Lint, types, tests, architecture boundaries, Deno-only rule, vulnerability and licence audit, every app's own checks.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: deno task secrets
      - run: deno task check
      - name: Licence allow-list and advisories (ai-kit pack)
        if: hashFiles('scripts/ai/audit.ts') != ''
        run: deno task audit
      - name: Static analysis rules (ai-kit pack)
        if: hashFiles('scripts/ai/sast.ts') != ''
        run: deno task sast

  secrets:
    # Looks for committed passwords, keys and tokens in the pull request's commits (the whole history on main).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/gitleaks
        with:
          log-opts: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}

  dependency-review:
    # Blocks a pull request that adds a dependency with a known vulnerability or a copyleft licence.
    # Free on public repositories; private repositories need GitHub Advanced Security: set the variable ADVANCED_SECURITY=true.
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.ADVANCED_SECURITY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Mirrors the ai-kit licence rule (scripts/ai/audit.ts): strong copyleft and source-available licences are refused.
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0, BUSL-1.1

  sbom:
    # Software bill of materials (CycloneDX): the list of everything the project is built from, kept as a build artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          syft-version: v1.57.2
          artifact-name: sbom.cdx.json
          output-file: sbom.cdx.json

  container:
    # Builds the backend image and scans it with Trivy. Steps skip themselves when there is no backend/Dockerfile.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the Dockerfile for risky settings
        if: hashFiles('backend/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.76.2
      - name: Set up Docker Buildx
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        if: hashFiles('backend/Dockerfile') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: app-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for known vulnerabilities
        if: hashFiles('backend/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.76.2

  required:
    # One stable name for branch protection. Skipped jobs (for example dependency review on a private repository) are fine.
    if: always()
    needs: [check, secrets, dependency-review, sbom, container]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
