paths:
  /billing:
    get:
      operationId: getBilling
      summary: Subscription status of the organization.
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billing" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /billing/checkout:
    post:
      operationId: createCheckout
      summary: Start a Stripe Checkout session; send the user to `url`.
      tags: [billing]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      summary: Stripe calls this; the signature is verified, nothing else may call it.
      tags: [billing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Event accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "400": { $ref: "#/components/responses/Problem" }
components:
  schemas:
    Billing:
      type: object
      required: [status]
      properties:
        status: { type: string, description: "none, active, past_due, canceled ... (Stripe subscription status)" }
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }
