paths:
  /audit-log:
    get:
      operationId: listAuditLog
      summary: Recent changes in the organization, newest first (owners and admins).
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of audit entries
          headers:
            X-Next-Cursor:
              description: Cursor for the next page; absent when there is none.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
components:
  schemas:
    AuditEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string }
        action: { type: string, description: 'Operation, e.g. "POST /notes".' }
        actorId: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
