# Builds the documentation site (website/) and deploys it to GitHub Pages.
# One-time setup by the repository owner: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "template/docs/**"
      - "stacks/**/README.md"
      - "stacks/**/docs/screenshots/**"
      - "stacks/*/stack.json"
      - "packs/**"
      - "modules/*/module.json"
      - "template/design/presets/**"
      - "README.md"
      - "DISCLAIMER.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CHANGELOG.md"
      - "CATALOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - name: Install
        working-directory: website
        run: deno install
      - name: Build (syncs docs and screenshots first)
        working-directory: website
        run: deno task build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
