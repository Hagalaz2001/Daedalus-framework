# Release: runs when a tag vX.Y.Z is pushed. Full check -> build assets, binaries, SBOM -> provenance -> GitHub Release -> JSR.
# No tokens: provenance and the JSR publish use GitHub's OIDC identity. See docs/RELEASING.md for the one-time owner steps.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DENO_VERSION: 2.9.8

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: deno task check
      - run: deno publish --dry-run

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      # The tarball first: its SHA-256 is then written into lib/embedded-checksums.ts, which the binaries and the JSR
      # package carry. The tarball excludes that file, so there is no circular dependency.
      - run: deno run -A tools/build-release.ts assets --embed
      - run: deno run -A tools/build-release.ts binaries
      - run: deno run -A tools/sbom.ts dist/sbom.cdx.json
      - run: deno run -A tools/build-release.ts checksums
      - run: deno run -A tools/release-prepare.ts notes "$(cat VERSION)" > dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-checksums
          path: lib/embedded-checksums.ts
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/daedalus-*
            dist/checksums.txt
            dist/sbom.cdx.json
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            dist/daedalus-* dist/checksums.txt dist/sbom.cdx.json dist/install.ps1 dist/install.sh dist/VERSION

  publish-jsr:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR trusts this repository's OIDC identity (linked on jsr.io), no token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embedded-checksums
          path: lib
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      # --allow-dirty: lib/embedded-checksums.ts was rewritten by the build job.
      - run: deno publish --allow-dirty
