[package]
name = "fw-app"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
fw-core = { path = "../core" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f401re", "time-driver-any", "memory-x", "exti"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"

[profile.release]
opt-level = "s"
lto = true
debug = true
