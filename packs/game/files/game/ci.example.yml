# Copy to .github/workflows/game.yml. setup-godot is MIT: https://github.com/chickensoft-games/setup-godot
# Pin actions to a commit SHA in your own repository.
name: game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - run: deno run -A game/check.ts
