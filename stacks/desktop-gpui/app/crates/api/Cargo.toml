[package]
name = "app-api"
description = "Typed HTTP client generated from contracts/openapi.yaml, plus the Better Auth calls."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "app_api"
doctest = false

[dependencies]
app-core.workspace = true
# Used by the generated client (progenitor, MPL-2.0).
progenitor-client = "=0.15.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Referenced by the generated code.
uuid = { version = "1", features = ["serde", "v4"] }
futures-core = "0.3"
bytes = "1"
percent-encoding = "2"
serde_urlencoded = "0.7"

[build-dependencies]
progenitor = "=0.15.1"
prettyplease = "0.3"
syn = "3"
serde_json = "1"
serde_yaml_ng = "0.10"
