[package]
name = "desktop-app"
version = "0.1.0"
description = "Desktop app (Tauri v2)"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-http = "=2.9.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
keyring = "=4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Small and fast binary: whole-program optimisation, one codegen unit, no symbols, abort instead of unwinding.
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
